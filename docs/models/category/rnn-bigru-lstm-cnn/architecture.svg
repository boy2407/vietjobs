al,sans-serif' font-size='11' text-anchor='start' fill='#111' font-weight='bold'>L1:</text><text x='160' y='459' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111'>?</text><text x='30' y='476' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111' font-weight='bold'>L2 / weight decay:</text><text x='160' y='476' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111'>weight_decay 1e-2 (mặc định)</text><text x='30' y='493' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111' font-weight='bold'>Dropout:</text><text x='160' y='493' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111'>spatial 0.2 trước RNN; 0.3 trước Linear cuối</text><text x='30' y='510' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111' font-weight='bold'>Bias terms:</text><text x='160' y='510' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111'>?</text><text x='30' y='527' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111' font-weight='bold'>Variance check:</text><text x='160' y='527' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='start' fill='#111'>? (no train/val numbers)</text></svg>